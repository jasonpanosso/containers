---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release

on:
  push:
    branches:
      - main
    paths:
      - apps/**
  workflow_dispatch:
    inputs:
      app:
        type: string
        description: App Name
        required: true

permissions:
  contents: read

jobs:
  changed:
    name: Get Changed Apps
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.app) || steps.changed.outputs.apps }}
    steps:
      - name: Validate Dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          APP: ${{ inputs.app }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF: ${{ github.ref }}
        run: |
          if [[ "${REF}" != "refs/heads/${DEFAULT_BRANCH}" ]]; then
              echo "::error::Releases can only be dispatched from ${DEFAULT_BRANCH}"
              exit 1
          fi
          if [[ ! "${APP}" =~ ^[a-z0-9-]+$ ]]; then
              echo "::error::App name must match ^[a-z0-9-]+\$"
              exit 1
          fi

      - name: Checkout
        if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Get Changed Apps
        if: ${{ github.event_name == 'push' }}
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.before }}
          HEAD: ${{ github.event.after }}
        run: |
          apps=$(.github/scripts/changed-apps.sh "$BASE" "$HEAD")
          echo "apps=$apps" >> "$GITHUB_OUTPUT"

  build:
    if: ${{ needs.changed.outputs.apps != '[]' }}
    name: Build ${{ matrix.app }}
    needs:
      - changed
    uses: $/.github/workflows/app-builder.yaml
    concurrency:
      group: release-${{ matrix.app }}
      cancel-in-progress: false
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    strategy:
      matrix:
        app: ${{ fromJSON(needs.changed.outputs.apps) }}
      fail-fast: false
    with:
      app: ${{ matrix.app }}
      release: true
