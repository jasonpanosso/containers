---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release

on:
  push:
    branches:
      - main
    paths:
      - apps/**
  workflow_dispatch:
    inputs:
      app:
        type: string
        description: App name, or "all" to release every app
        required: true

permissions:
  contents: read

jobs:
  changed:
    name: Get Changed Apps
    runs-on: ubuntu-26.04
    outputs:
      apps: ${{ steps.dispatch.outputs.apps || steps.changed.outputs.apps }}
    steps:
      - name: Get Dispatched Apps
        if: ${{ github.event_name == 'workflow_dispatch' }}
        id: dispatch
        env:
          APP: ${{ inputs.app }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          if [[ "${REF}" != "refs/heads/${DEFAULT_BRANCH}" ]]; then
              echo "::error::Releases can only be dispatched from ${DEFAULT_BRANCH}"
              exit 1
          fi
          all="$(
              gh api "repos/${GITHUB_REPOSITORY}/contents/apps?ref=${SHA}" \
                  --jq '.[] | select(.type == "dir") | .name' | jq --raw-input --null-input --compact-output '[inputs]'
          )"
          if [[ "${APP}" == "all" ]]; then
              apps="${all}"
          elif jq --exit-status --arg app "${APP}" 'index($app)' <<< "${all}" > /dev/null; then
              apps="$(jq --null-input --compact-output --arg app "${APP}" '[$app]')"
          else
              echo "::error::Unknown app; expected one of $(jq --raw-output 'join(", ")' <<< "${all}") or all"
              exit 1
          fi
          echo "apps=${apps}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: ${{ github.event_name == 'push' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Get Changed Apps
        if: ${{ github.event_name == 'push' }}
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.before }}
          HEAD: ${{ github.event.after }}
        run: |
          apps=$(.github/scripts/changed-apps.sh "$BASE" "$HEAD")
          echo "apps=$apps" >> "$GITHUB_OUTPUT"

  build:
    if: ${{ needs.changed.outputs.apps != '[]' }}
    name: Build ${{ matrix.app }}
    needs:
      - changed
    uses: $/.github/workflows/app-builder.yaml
    concurrency:
      group: release-${{ matrix.app }}
      cancel-in-progress: false
    permissions:
      attestations: write # app-builder attests images
      contents: read
      id-token: write # app-builder signs attestations
      packages: write # app-builder pushes images to ghcr
    strategy:
      matrix:
        app: ${{ fromJSON(needs.changed.outputs.apps) }}
      fail-fast: false
    with:
      app: ${{ matrix.app }}
      release: true
