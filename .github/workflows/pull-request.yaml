---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Pull Request

on:
  pull_request:
    branches:
      - main
    paths:
      - apps/**
      - .github/scripts/changed-apps.sh
      - .github/workflows/app-builder.yaml
      - .github/workflows/pull-request.yaml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changed:
    name: Get Changed Apps
    runs-on: ubuntu-26.04
    outputs:
      apps: ${{ steps.changed.outputs.apps }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Get Changed Apps
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          # changes to the shared build pipeline rebuild every app
          REBUILD_ALL_PATHS: >-
            .github/scripts/changed-apps.sh
            .github/workflows/app-builder.yaml
            .github/workflows/pull-request.yaml
        run: |
          apps=$(.github/scripts/changed-apps.sh "$BASE" "$HEAD")
          echo "apps=$apps" >> "$GITHUB_OUTPUT"

  build:
    if: ${{ needs.changed.outputs.apps != '[]' }}
    name: Build ${{ matrix.app }}
    needs:
      - changed
    uses: $/.github/workflows/app-builder.yaml
    permissions:
      # app-builder jobs declare these; PR runs skip pushing and attesting
      attestations: write # app-builder attests images
      contents: read
      id-token: write # app-builder signs attestations
      packages: write # app-builder pushes images to ghcr
    strategy:
      matrix:
        app: ${{ fromJSON(needs.changed.outputs.apps) }}
      fail-fast: false
    with:
      app: ${{ matrix.app }}
      release: false
